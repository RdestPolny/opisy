name: Fix workspace widget state

on:
  push:
    branches: [fix-workspace-widget-state]
    paths: ['.github/workflows/fix-workspace-widget-state.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-workspace-widget-state
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text()
          text = text.replace('APP_VERSION = "4.9.2"', 'APP_VERSION = "4.9.3"', 1)

          old = '''        with st.expander("Dodaj nową kolejkę"):\n            new_workspace_name = st.text_input(\n                "Nazwa kolejki",\n                placeholder="np. Bartek, Marcin, BOK 1",\n                key="new_description_workspace_name",\n            )\n            if st.button("Utwórz i przełącz", key="create_description_workspace"):\n                try:\n                    created_workspace = create_description_workspace(new_workspace_name)\n                    st.session_state.new_description_workspace_name = ""\n                    switch_description_workspace(created_workspace["workspace_id"])\n                    st.rerun()\n                except ValueError as exc:\n                    st.error(str(exc))\n'''
          new = '''        with st.expander("Dodaj nową kolejkę"):\n            if st.session_state.pop("clear_new_description_workspace_name", False):\n                st.session_state["new_description_workspace_name"] = ""\n            new_workspace_name = st.text_input(\n                "Nazwa kolejki",\n                placeholder="np. Bartek, Marcin, BOK 1",\n                key="new_description_workspace_name",\n            )\n            if st.button("Utwórz i przełącz", key="create_description_workspace"):\n                try:\n                    created_workspace = create_description_workspace(new_workspace_name)\n                    st.session_state.clear_new_description_workspace_name = True\n                    switch_description_workspace(created_workspace["workspace_id"])\n                    st.rerun()\n                except ValueError as exc:\n                    st.error(str(exc))\n'''
          if old not in text:
              raise SystemExit('Expected workspace creation block not found')
          path.write_text(text.replace(old, new, 1))

          test_path = Path('tests/test_streamlit_workspace_ui_source.py')
          test_path.write_text('''import unittest\nfrom pathlib import Path\n\n\nclass WorkspaceUiSourceTests(unittest.TestCase):\n    def test_does_not_mutate_text_input_key_after_widget_instantiation(self):\n        source = (Path(__file__).parents[1] / "app.py").read_text()\n        self.assertNotIn('st.session_state.new_description_workspace_name = ""', source)\n        self.assertIn('st.session_state.pop("clear_new_description_workspace_name", False)', source)\n        self.assertIn('st.session_state.clear_new_description_workspace_name = True', source)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')

          changelog = Path('CHANGELOG.md')
          changelog.write_text('''# 4.9.3\n\nNaprawiono błąd Streamlit przy tworzeniu nowej kolejki. Pole nazwy jest teraz czyszczone dopiero w kolejnym rerunie, zanim widget zostanie utworzony.\n\n''' + changelog.read_text())
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit hotfix
        shell: bash
        run: |
          rm .github/workflows/fix-workspace-widget-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py tests/test_streamlit_workspace_ui_source.py CHANGELOG.md .github/workflows/fix-workspace-widget-state.yml
          git commit -m "Fix Streamlit workspace name widget state"
          git push origin HEAD:fix-workspace-widget-state
