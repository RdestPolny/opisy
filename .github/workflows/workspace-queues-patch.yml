name: Apply workspace queue isolation

on:
  push:
    branches:
      - workspace-queues
    paths:
      - .github/workflows/workspace-queues-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: workspace-queues
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply code changes
        run: python .github/apply_workspace_patch.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit implementation
        run: |
          rm .github/workflows/workspace-queues-patch.yml
          rm .github/apply_workspace_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py workspace_storage.py tests/test_workspace_storage.py CHANGELOG.md .github/workflows/workspace-queues-patch.yml .github/apply_workspace_patch.py
          git commit -m "Isolate description workspaces by queue"
          git push origin HEAD:workspace-queues
